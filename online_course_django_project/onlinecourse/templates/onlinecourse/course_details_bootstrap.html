<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ course.name }} | Online Course</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-5">
  <a href="{% url 'course_list' %}" class="btn btn-outline-secondary mb-3">All courses</a>
  <div class="card mb-4"><div class="card-body">
    <h1>{{ course.name }}</h1>
    <p class="mb-0">{{ course.description }}</p>
  </div></div>
  <h2 class="h3 mb-3">Lessons</h2>
  <div class="list-group">
    {% for lesson in course.lessons.all %}
      <div class="list-group-item">
        <h3 class="h5">{{ lesson.order }}. {{ lesson.title }}</h3>
        <p>{{ lesson.content|default:"Lesson content coming soon." }}</p>
        <a class="btn btn-primary btn-sm" href="{% url 'lesson_exam' lesson.id %}">Take mock exam</a>
      </div>
    {% empty %}
      <div class="list-group-item">No lessons have been added to this course yet.</div>
    {% endfor %}
  </div>
</main>
</body>
</html>
