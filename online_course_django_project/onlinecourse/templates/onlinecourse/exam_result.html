<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exam Results</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-5">
  <div class="card shadow-sm"><div class="card-body p-4">
    {% if percentage >= 70 %}
      <h1 class="text-success">Congratulations!</h1>
      <p>You passed the mock exam.</p>
    {% else %}
      <h1>Exam Results</h1>
      <p>Keep practicing and try again.</p>
    {% endif %}
    <p class="fs-5">Score: <strong>{{ result.score }} / {{ result.total_score }}</strong></p>
    <p>Percentage: <strong>{{ percentage }}%</strong></p>
    <p>Lesson: {{ result.lesson.title }}</p>
    <a class="btn btn-primary" href="{% url 'course_details' result.lesson.course.id %}">Back to course</a>
  </div></div>
</main>
</body>
</html>
